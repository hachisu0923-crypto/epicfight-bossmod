plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 targets Java 17. Building with a newer JDK (e.g. 21) is not supported by
// ForgeGradle's decompile/recompile toolchain — install a JDK 17 to run ./gradlew build.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Bundle datapack-style generated/static resources alongside the mod's own resources.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // EpicFight is published on Modrinth's Maven. exclusiveContent keeps that repo scoped to the
    // maven.modrinth group only, and forRepositories(fg.repository) lets ForgeGradle deobfuscate it.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Pure datapack approach: this mod has no compile-time EpicFight imports, so a runtime
    // dependency is enough. Switch to implementation only if you later call EpicFight APIs from Java.
    runtimeOnly fg.deobf("maven.modrinth:epic-fight:${epicfight_version}")
}

// Expand build properties into mods.toml / pack.mcmeta if placeholders are used. The bundled
// mods.toml is hard-coded today, so this is a harmless pass-through that future-proofs the build.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version  : minecraft_version,
            forge_version      : forge_version,
            mod_id             : mod_id,
            mod_version        : mod_version,
            epicfight_version  : epicfight_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version
        ])
    }
}
