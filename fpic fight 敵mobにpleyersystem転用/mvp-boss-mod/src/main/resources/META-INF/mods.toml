issueTrackerURL="https://example.com"

[[mods]]
modId="efbossmvp"
version="1.0.0"
displayName="EpicFight MVP Boss"
authors="you"
description='''
Adds EpicFight bosses. efbossmvp:dread_knight uses EpicFight player-skill animations via a
datapack. efbossmvp:ronin is an uchigatana duelist with real Guard/Parry/stamina (Epic Fight -
Indestructible) plus a Java reactive layer (Step dodge / Phantom Ascent / Emergency Escape).
Requires EpicFight base mod and Epic Fight - Indestructible (+ Invincible Lib).
'''

# --- Forge（定型） ---
[[dependencies.efbossmvp]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

# --- Minecraft（定型） ---
[[dependencies.efbossmvp]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# --- EpicFight 本体（前提依存・ハード依存） ---
# 導入する EpicFight jar 版に合わせて versionRange を調整すること。
# ordering=AFTER で EpicFight のレジストリ後に本modをロードする。
[[dependencies.efbossmvp]]
    modId="epicfight"
    mandatory=true
    versionRange="[20.14,)"
    ordering="AFTER"
    side="BOTH"

# --- Epic Fight - Indestructible（層2：mob の Guard/Parry/スタミナ） ---
# ronin の advanced_mobpatch を読ませるためハード依存。導入版に合わせて versionRange を調整。
# modId は導入する Indestructible の実際の modId に一致させること（既定は "indestructible"）。
[[dependencies.efbossmvp]]
    modId="indestructible"
    mandatory=true
    versionRange="[20.9,)"
    ordering="AFTER"
    side="BOTH"
